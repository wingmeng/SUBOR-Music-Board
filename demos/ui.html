<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      padding: 0;
      margin: 0;
      background: #000;
    }

    .board {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 2 * 56px);
      width: 32em;
      margin: 56px auto;
      box-sizing: border-box;
      line-height: 1.25;
      font-size: 20px;
      font-family: Consolas, 'Courier New', monospace;  /* 届时换成NES字体 */
      color: #fff;
      border: 17px solid;
      border-image: url(./border.svg) 17;
      box-shadow: 0 0 0 2px #fff inset,
        0 0 0 2px #fff,
        0 0 0 56px #c33;
    }

    .board-title {
      padding: 0.2em 2em;
      margin: 8px auto;
      white-space: pre;
      font-weight: 500;
      border: 4px solid #36c;
      border-radius: 0.4em;
    }

    .board-main {
      flex: 1;
      min-height: 0;
      word-break: break-all;
      scrollbar-gutter: stable both-edges;
      overflow: auto;
    }

    .notation {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 5px;
      padding: 0 0 8px;
      margin: 0;
      list-style: none;
    }

    /* 行分隔线 */
    .notation > li {
      padding-bottom: 2px;
      border-bottom: 2px solid #699;
    }
    .notation > li:nth-child(4n + 3),
    .notation > li:nth-child(4n + 4) {border-color: #c99;}

    .quill {
      position: absolute;
      top: 0;
      left: 0;
      width: 20px;
      aspect-ratio: 42 / 80;
      transform: rotate(120deg);
      background: url(./pen.png) no-repeat;
      background-size: contain;
      animation-composition: add;
      transition: 0.2s ease-in-out;
      transition-property: top, left;
      will-change: top, left;
    }

    .notation input {
      display: block;
      width: 1em;
      height: 1em;
      box-sizing: border-box;
      text-align: center;
      font-size: 100%;
      color: #fff;
      background: transparent;
      border: 1px solid transparent;
      outline: none;
      caret-color: transparent;
    }

    .notation > li:first-child > input {border-radius: 2px 2px 0 0;}
    .notation > li:last-child > input {border-radius: 0 0 2px 2px;}
    .notation input + .notation input {margin-top: -1px;}
    .notation > .current > input {border-color: #9c3;}

    .writing {
      animation: write 0.5s linear;
      animation-fill-mode: backwards;
    }

    @keyframes write {
      15% {transform: translate(1px, 8px);}
      30% {transform: translate(2px, 10px);}
      45% {transform: translate(3px, 6px);}
      60% {transform: translate(3px, 3px);}
      80% {transform: translate(2px, 6px);}
    }

    .shake {animation: shake 0.8s ease-in-out;}

    @keyframes shake {
      10%, 90% {transform: translate3d(-1px, 0, 0);}
      20%, 80% {transform: translate3d(2px, 0, 0);}
      30%, 70% {transform: translate3d(-4px, 0, 0);}
      40%, 60% {transform: translate3d(4px, 0, 0);}
      50% {transform: translate3d(-4px, 0, 0);}
    }
  </style>
</head>
<body>
  <div class="board">
    <h2 class="board-title">MUSIC BOARD</h2>
    <div class="board-main">
      <ul class="notation">
        <li data-index="0">
          <input type="text" data-index="0" maxlength="1" autocomplete="off">
          <input type="text" data-index="1" maxlength="1" autocomplete="off">
          <input type="text" data-index="2" maxlength="1" autocomplete="off">
        </li>
      </ul>
      <div class="quill"></div>
      <div class="control-bar">
        <div class="speed-control">
          <span>FAST</span>
          <input type="range" class="speed-handler" />
          <span>SLOW</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const columns = 23;
    const list = document.querySelector('.notation');

    list.innerHTML = Array.from({ length: 138 }, (_, i) => `
      <li data-index="${i}">
        ${
          Array.from({ length: 3 }, (_, j) => 
            `<input type="text" data-index="${j}" maxlength="1" autocomplete="off">`
          ).join('\n')
        }
      </li>
    `).join('\n');

    list.querySelector('li').classList.add('current');

    const listItems = list.querySelectorAll('li');
    const quill = document.querySelector('.quill');
    let writing = false;

    list.addEventListener('keydown', ({ key, target }) => {
      if (target.tagName !== 'INPUT') {
        return;
      }

      let rowIndex = Number(target.dataset.index);
      let colIndex = Number(target.parentNode.dataset.index);
      let isCharacterKey = false;

      switch (key) {
        case 'ArrowUp':
          if (rowIndex === 0) {
            if (colIndex > 0) {
              colIndex -= 1;
              rowIndex = 2;
            }
          } else {
            rowIndex -= 1;
          }
          break;
        case 'ArrowDown':
          if (rowIndex === 2) {
            if (colIndex < listItems.length - 1) {
              colIndex += 1;
              rowIndex = 0;
            }
          } else {
            rowIndex += 1;
          }
          break;
        case 'ArrowLeft':
          colIndex -= Number(colIndex > 0);
          break;
        case 'ArrowRight':
          colIndex += Number(colIndex < listItems.length - 1);
          break;
        case 'Backspace':
          colIndex -= Number(colIndex > 0);
          break;
        default:  // 其他字符（含删除键）
          isCharacterKey = true;
          target.select();  // 先选中字符，用以覆盖式更新
      }

      if (!isCharacterKey) {
        listItems[colIndex].querySelectorAll('input')[rowIndex].focus();
      }
    });

    list.addEventListener('input', (e) => {
      if (['deleteContentForward', 'deleteContentBackward'].includes(e.inputType)) {
        return;
      }

      if (writing) {
        return;
      }

      const { target } = e;

      if (!(/[a-g1-7\s]/i.test(target.value))) {  // 不能输入其他字符
        target.classList.remove('shake');
        requestAnimationFrame(() => target.classList.add('shake'));
        return;
      }

      let inputIndex = Number(target.dataset.index);
      let liIndex = Number(target.parentNode.dataset.index);

      if (liIndex === listItems.length - 1 && inputIndex === 2) {  // 最后一个输入框
        return;
      }

      if (liIndex === listItems.length - 1) {  // 最后一行
        liIndex = 0;
        inputIndex++;
      } else {
        liIndex++;
      }

      const nextInput = listItems[liIndex].querySelectorAll('input')[inputIndex];

      writing = true;
      quill.classList.add('writing');
      requestAnimationFrame(() => {
        nextInput.focus();
      });
    });

    list.addEventListener('animationend', ({ target }) => {
      if (target.tagName === 'INPUT') {
        target.classList.remove('shake');
      }
    });

    list.addEventListener('focus', ({ target }) => {
      const { x, y, width, height } = target.getBoundingClientRect();
      const callback = () => {
        writing = false;
        quill.style.left = `${x + width / 2}px`;
        quill.style.top = `${y + height / 2 - 5}px`;
      };

      if (quill.classList.contains('writing')) {
        qill.onanimationend = () => {
          target.classList.remove('writing');
          callback();
        };
      } else {
        callback();
      }
    }, true);

    quill.addEventListener('animationend', () => {
      quill.classList.remove('writing');
    });

    list.querySelector('input').focus();
  </script>
</body>
</html>
