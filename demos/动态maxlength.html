<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <input type="text" id="input" maxlength="1">

  <script>
    const input = document.getElementById('input');

    input.addEventListener('input', e => {
      if (e.isComposing) {
        return;
      }

      if (['deleteContentForward', 'deleteContentBackward'].includes(e.inputType)) {
        const limit = input.getAttribute('maxlength') - 1;
        input.setAttribute('maxlength', limit < 1 ? 1 : limit);
      }

      if ([',', '.', '#', 'b'].includes(e.data)) {
        input.setAttribute('maxlength', 4);
      } else if (/\d/.test(e.data || '')) {
        input.setAttribute('maxlength', input.value.length);
      }
    }); 
  </script>
</body>
</html>
