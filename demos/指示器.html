<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      --color-normal: #ccc;
      --color-current: #648019;

      display: flex;
      flex-wrap: wrap;
      gap: 10px 4px;
      max-width: 400px;
      padding: 0;
      margin: 20px;
      list-style: none;
    }

    .box > li {
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      width: 1.8em;
      height: 5em;
      border: 2px solid transparent;
      border-bottom-color: var(--color-normal);
    }

    .box > .current {
      background: linear-gradient(to right,
        transparent 0,
        transparent 33.333%,
        currentColor 33.333%,
        currentColor 66.666%,
        transparent 66.666%,
        transparent 100%
      );
      border-color: var(--color-current);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <ul class="box">
    <li class="current">
      <span>a</span>
      <span>b</span>
      <span>c</span>
    </li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
  </ul>

  <script>
    const items = document.querySelectorAll('.box > li');
    let index = 0;
    let playing = false;
    let timer = null;

    document.onkeydown = ({ code }) => {
      if (code === 'Space') {
        playing = !playing;
        play(playing);
      }
    };

    function play(start) {
      if (start) {
        timer = setInterval(() => {
          const current = items[index];
          const last = items[(index === 0 ? items.length : index) - 1];

          current.classList.add('current');
          last.classList.remove('current');

          index++;

          if (index === items.length) {
            index = 0;
          }
        }, 200);
      } else {
        clearInterval(timer);
      }
    }
  </script>
</body>
</html>
