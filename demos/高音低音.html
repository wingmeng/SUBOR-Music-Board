<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P">
  <link rel="stylesheet" href="https://unpkg.com/nes.css@2.2.1/css/nes-core.min.css">
  <style>
    .box {
      display: flex;
      max-width: 600px;
      margin: 50px auto;
    }

    .tone {
      position: relative;
      word-break: break-word;
      line-height: 1.6;

      &::before,
      &::after {
        position: absolute;
        left: 50%;
        width: 1em;
        font-size: 0.4em;
      }
    }

    .s1::before, .s-1::after {content: '▪';}

    .s1::before {
      top: 0;
      transform: translate(-50%, -100%);
    }

    .s-1::after {
      bottom: 0;
      transform: translate(-50%, 100%);
    }
  </style>
</head>
<body>
  <div class="box">
    <span class="tone s1">1</span>
    <span class="tone">1</span>
    <span class="tone s-1">1</span>

    <span class="tone s1">2</span>
    <span class="tone">2</span>
    <span class="tone s-1">2</span>

    <span class="tone s1">3</span>
    <span class="tone">3</span>
    <span class="tone s-1">3</span>

    <span class="tone s1">4</span>
    <span class="tone">4</span>
    <span class="tone s-1">4</span>

    <span class="tone s1">5</span>
    <span class="tone">5</span>
    <span class="tone s-1">5</span>

    <span class="tone s1">6</span>
    <span class="tone">6</span>
    <span class="tone s-1">6</span>

    <span class="tone s1">7</span>
    <span class="tone">7</span>
    <span class="tone s-1">7</span>
  </div>
</body>
</html>
